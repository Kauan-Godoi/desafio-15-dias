<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro de tarefa</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div id="principal">

        <h1>cadastro de tarefas</h1>
        <a href="./listarTarefas.html">visualizar listas</a>
        <div>

            <label for="titulo">Titulo da tarefa</label>
            <br>
            <input id="titulo" type="text" placeholder="Titulo da tarefa">

            <div>
                <label for="descricao">Descrição da tarefa</label>
                <br>
                <textarea id="descricao" placeholder="Descrição da tarefa"></textarea>
            </div>

            <button onclick="criar_tarefa()">Cadastrar</button>

        </div>
        <p id="mensagem"></p>

    </div>
    <script src="/script.js"></script>  
</body>
</html>
